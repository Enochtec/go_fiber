services:
  - type: web
    name: one-stop-pos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: one-stop-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"

databases:
  - name: one-stop-pos-db
    databaseName: pos_db
    user: pos_user
    plan: free